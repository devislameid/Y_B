<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIN إلى نمط Android</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f3f5f8;color:#172033;font-family:Tahoma,Arial,sans-serif}
  main{max-width:520px;margin:28px auto;padding:22px;background:#fff;border-radius:18px;box-shadow:0 8px 28px #15223814}
  h1{font-size:23px;margin:0 0 8px}
  p{color:#5c6678;line-height:1.7;margin:8px 0 18px}
  label{display:block;font-weight:bold;margin:14px 0 8px}
  input{width:100%;padding:14px;border:1px solid #cbd2dc;border-radius:10px;font-size:22px;letter-spacing:5px;text-align:center;direction:ltr}
  button{border:0;border-radius:10px;padding:12px 17px;margin:12px 6px 0 0;background:#1d4ed8;color:#fff;font-size:15px;cursor:pointer}
  button.secondary{background:#475569}
  #msg{min-height:24px;color:#b42318;font-size:14px;margin-top:8px}
  .board{width:min(100%,350px);margin:18px auto 8px;display:block}
  .hint{font-size:13px;text-align:center}
  .actions{text-align:center}
</style>
</head>
<body>
<main>
  <h1>تحويل PIN إلى نمط Android</h1>
  <p>اكتب الأرقام من 1 إلى 9، وسيظهر مسار الرسم على شبكة القفل. الأداة تعمل محليًا دون إنترنت.</p>
  <label for="pin">رمز PIN</label>
  <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="مثال: 12369">
  <div id="msg"></div>
  <svg id="board" class="board" viewBox="0 0 300 300" role="img" aria-label="رسم نمط أندرويد">
    <rect x="1" y="1" width="298" height="298" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
    <polyline id="path" points="" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="dots"></g>
  </svg>
  <div class="hint">ترقيم النقاط: 1 2 3 / 4 5 6 / 7 8 9</div>
  <div class="actions">
    <button id="draw">عرض النمط</button>
    <button class="secondary" id="save">حفظ صورة PNG</button>
    <button class="secondary" id="clear">مسح</button>
  </div>
</main>
<script>
const coords = {
  1:[50,50], 2:[150,50], 3:[250,50],
  4:[50,150],5:[150,150],6:[250,150],
  7:[50,250],8:[150,250],9:[250,250]
};
const input=document.getElementById('pin');
const msg=document.getElementById('msg');
const svg=document.getElementById('board');
const path=document.getElementById('path');
const dots=document.getElementById('dots');

function render(){
  const value=input.value.trim();
  msg.textContent='';
  if(!value){msg.textContent='اكتب رمز PIN أولًا.'; return false;}
  if(!/^[1-9]+$/.test(value)){
    msg.textContent='استخدم الأرقام من 1 إلى 9 فقط، بدون رقم 0.';
    return false;
  }
  const points=[...value].map(Number);
  const unique=[...new Set(points)];
  const xy=unique.map(n=>coords[n].join(',')).join(' ');
  path.setAttribute('points',xy);
  dots.innerHTML='';
  unique.forEach((n,i)=>{
    const [x,y]=coords[n];
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y);
    c.setAttribute('r',i===0?15:12);
    c.setAttribute('fill',i===0?'#16a34a':(i===unique.length-1?'#dc2626':'#fff'));
    c.setAttribute('stroke',i===0?'#16a34a':(i===unique.length-1?'#dc2626':'#64748b'));
    c.setAttribute('stroke-width','4');
    dots.appendChild(c);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',y+5);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','13');
    t.setAttribute('font-family','Arial');t.setAttribute('font-weight','bold');
    t.setAttribute('fill',i===0||i===unique.length-1?'#fff':'#334155');
    t.textContent=n;dots.appendChild(t);
  });
  if(unique.length!==points.length){
    msg.textContent='تنبيه: نمط القفل لا يكرر النقطة؛ تم إظهار كل نقطة مرة واحدة فقط.';
  }
  return true;
}
document.getElementById('draw').onclick=render;
input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'');});
document.getElementById('clear').onclick=()=>{input.value='';path.setAttribute('points','');dots.innerHTML='';msg.textContent='';};
document.getElementById('save').onclick=()=>{
  if(!render()) return;
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const source=new XMLSerializer().serializeToString(clone);
  const url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');canvas.width=900;canvas.height=900;
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,900,900);
    ctx.drawImage(img,0,0,900,900);URL.revokeObjectURL(url);
    const a=document.createElement('a');a.download='android-pattern.png';a.href=canvas.toDataURL('image/png');a.click();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);msg.textContent='تعذر حفظ الصورة في هذا المتصفح.';};
  img.src=url;
};
input.addEventListener('keydown',e=>{if(e.key==='Enter')render();});
</script>
</body>
</html>
